<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Billo — Admin</title>
<style>
:root{--billo-blue:#1677ff;--billo-deep:#0b2d5c;--billo-ink:#122033;--billo-bg:#f4f8ff;--billo-card:#ffffff;--billo-border:#dbe6f5;--billo-muted:#64748b;--billo-shadow:0 12px 32px rgba(17,62,120,.10);--billo-ok:#16723b;--billo-bad:#b00020}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;padding:18px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(180deg,#eef6ff 0%,#f8fbff 45%,#f4f7fb 100%);color:var(--billo-ink)}
a{color:var(--billo-blue);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
h1,h2,h3{color:var(--billo-deep);margin:0 0 10px}
.wrap{max-width:1180px;margin:0 auto}
.box,.card{background:rgba(255,255,255,.97);border:1px solid var(--billo-border);border-radius:18px;box-shadow:var(--billo-shadow);padding:22px;margin-bottom:16px}
.box{max-width:560px;margin:30px auto}
.box.wide{max-width:760px}
input,select,textarea,button{font-size:15px;padding:11px;border:1px solid #cbd8ea;border-radius:11px;font-family:inherit}
input,select,textarea{width:100%;background:#fff;color:var(--billo-ink);margin:6px 0}
textarea{min-height:90px;font-family:ui-monospace,Menlo,Consolas,monospace}
label{font-weight:600;font-size:13px;color:var(--billo-deep);display:block;margin-top:8px}
button{background:linear-gradient(135deg,var(--billo-blue),#3c8cff);border:0;color:#fff;cursor:pointer;box-shadow:0 7px 16px rgba(22,119,255,.20);font-weight:600}
button.secondary{background:#eef3fb;color:var(--billo-deep);box-shadow:none;border:1px solid var(--billo-border)}
button.danger{background:linear-gradient(135deg,#e0334f,#ff5a71)}
button:disabled{opacity:.5;cursor:not-allowed}
button:hover:not(:disabled){opacity:.94}
.row{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.nav a{font-size:13px;font-weight:600;margin-right:2px}
.nav{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.billo-brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.billo-brand img{width:42px;height:42px;object-fit:contain}
.billo-brand strong{font-size:24px;letter-spacing:-.03em;color:var(--billo-deep)}
.billo-pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#e9f2ff;color:var(--billo-blue);font-weight:700;font-size:11px;vertical-align:middle}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid var(--billo-border);padding:8px;text-align:left;font-size:13.5px}
th{background:#eaf3ff;color:var(--billo-deep)}
.tblwrap{overflow-x:auto}
.stat{border:1px solid var(--billo-border);border-radius:14px;padding:16px;background:linear-gradient(180deg,#fff,#f5f9ff);box-shadow:var(--billo-shadow)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.muted,.small{color:var(--billo-muted);font-size:13px}
.err{color:var(--billo-bad);font-weight:700}
.ok{color:var(--billo-ok);font-weight:700}
.grid-items{display:grid;grid-template-columns:44px 2fr 1fr 1fr 1fr 40px;gap:6px;margin:6px 0;align-items:center}
.grid-items.hdr{font-weight:700;background:#eaf3ff;padding:8px 0;border-radius:8px;font-size:12px;color:var(--billo-deep)}
.grid-items>*{min-width:0}
.total-box{text-align:right;font-size:16px;border-top:2px solid var(--billo-border);padding-top:12px;margin-top:8px;line-height:1.9}
.total-box b{font-size:22px}
.pay-panel{text-align:center;display:none;border:2px solid var(--billo-border);border-radius:14px;padding:20px;margin-top:16px}
.pay-panel img{max-width:240px;width:100%}
.loyalty-box{background:#f7faff;border:1px solid var(--billo-border);padding:12px;border-radius:10px;margin:10px 0;font-size:14px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:18px 0}
.plan{border:2px solid var(--billo-border);border-radius:16px;padding:20px;background:#fafcff;text-align:center}
.plan .price{font-size:26px;font-weight:800;margin:10px 0;color:var(--billo-deep)}
.plan .actions{display:grid;gap:8px;margin-top:12px}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.badge.demo{background:#fff2d9;color:#946200}
.badge.merchant{background:#e7f6ec;color:#146c3a}
.actions-inline{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.actions-inline form{margin:0;display:inline-flex;gap:6px}
.chip-input{width:auto;display:inline-block}
.pagehead{margin-bottom:14px}
.qr-thumb{width:64px;height:64px;object-fit:contain;background:#fff;border:1px solid var(--billo-border);border-radius:6px}
.footnote{font-size:12px;color:var(--billo-muted);margin-top:6px}
.center{text-align:center}
.hidden{display:none !important}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#122033;color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:9999;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}
@media(max-width:700px){
  body{padding:10px}
  .grid-items{grid-template-columns:32px 1fr 1fr}
  .grid-items .price-cell{grid-column:2}
  .grid-items .amount-cell{grid-column:3}
  .grid-items .remove-cell{grid-column:3}
  .plans{grid-template-columns:1fr}
  th,td{font-size:12px;padding:6px}
}
/* Print receipt view */
@media print{
  body *{visibility:hidden}
  #printArea, #printArea *{visibility:visible}
  #printArea{display:block !important;position:absolute;left:0;top:0;width:80mm;margin:0;padding:6px}
}
.receipt{font-family:Arial,sans-serif;width:80mm;margin:20px auto;font-size:11px;padding:8px;border:1px solid #111;color:#111;background:#fff}
.receipt h1{font-size:17px;margin:0 0 4px;color:#111}
.receipt .rline{border-top:1px solid #111;margin:7px 0}
.receipt .meta{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;font-size:11px}
.receipt table{width:100%;border-collapse:collapse;margin-top:5px}
.receipt th,.receipt td{border:1px solid #111;padding:3px 2px;vertical-align:top;font-size:10px;background:none;color:#111}
.receipt .r{text-align:right}
.receipt .big{font-size:14px;font-weight:700}
.receipt .small{font-size:9px}

</style>
</head>

function QRPolynomial(num, shift) {

function qrSVG(text, opts){

  words[words[lengthProperty]] = ((asciiBitLength/maxWord)|0);

    var w = words.slice(j, j+=16);

/* Resize + recompress an uploaded image file before storing it (raw phone photos/screenshots
   can be several MB each; localStorage has a small total quota shared by everything in Billo). */
function compressImageFile(file, maxDim, quality){
  maxDim = maxDim || 1000; quality = quality || 0.72;
  return new Promise(function(resolve, reject){
    if (!file || file.type.indexOf('image/') !== 0){ reject(new Error('Please choose an image file (JPG, PNG, or WEBP).')); return; }
    if (file.size > 10*1024*1024){ reject(new Error('That image is larger than 10 MB. Please choose a smaller file.')); return; }
    var reader = new FileReader();
    reader.onerror = function(){ reject(new Error('Could not read that file.')); };
    reader.onload = function(){
      var img = new Image();
      img.onerror = function(){ reject(new Error('That file is not a readable image.')); };
      img.onload = function(){
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, maxDim / Math.max(w, h));
        var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,cw,ch);
        ctx.drawImage(img, 0, 0, cw, ch);
        try { resolve(canvas.toDataURL('image/jpeg', quality)); }
        catch(e){ reject(new Error('Could not process that image.')); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function humanFileSize(bytes){

/* Payment code: BL- + 7 chars, cryptographically random, excludes look-alike characters
   (0/O, 1/I) since it's hand-typed into Fonepay's remarks field on a phone keyboard.
   Uniqueness is checked against every code ever issued (any status, forever) so an
   approved/rejected/expired code can never be reissued or reused for another payment. */
var PAYMENT_CODE_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function makePaymentCode(db){
  var code, exists;
  do {
    var arr = new Uint8Array(7);
    if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(arr);
    else for (var i=0;i<7;i++) arr[i] = Math.floor(Math.random()*256);
    var s = '';
    for (var i=0;i<7;i++) s += PAYMENT_CODE_ALPHABET[arr[i] % PAYMENT_CODE_ALPHABET.length];
    code = 'BL-'+s;
    exists = (db.subscriptionPayments||[]).some(function(p){ return p.payment_code===code; }) ||
      (db.draftCodes && Object.keys(db.draftCodes).some(function(k){ return db.draftCodes[k].code===code; }));
  } while (exists);
  return code;
}

   All Fonepay-manual-verification workflow logic lives behind this one object. Subscription
   activation itself stays in activatePaidSubscription() (shared with Fonepay-demo and
   validity-key activation) so a future EsewaApiProvider could call .approve()'s same
   underlying activation path automatically, without touching subscription logic at all. */
var ManualVerificationProvider = {
  /* Shows the same code every time the merchant revisits this plan's payment page, before
     they've formally submitted a voucher (drafts aren't visible to admin yet). */
  getOrCreateDraftCode: function(db, merchantId, planCode){
    db.draftCodes = db.draftCodes || {};
    var key = merchantId+':'+planCode;
    if (!db.draftCodes[key]) db.draftCodes[key] = { code: makePaymentCode(db), created_at: nowISO() };
    return db.draftCodes[key].code;
  },

  findActivePendingForMerchant: function(db, merchantId){
    return (db.subscriptionPayments||[]).find(function(p){
      return p.merchant_id===merchantId && p.method==='fonepay' && p.status===PAYMENT_STATUS.PENDING;
    }) || null;
  },

  submit: function(db, merchant, plan, planCode, code, voucherDataUrl, voucherMeta, senderName){
    var now = new Date();
    var rec = {
      id: nextSeq(db,'payments'), merchant_id: merchant.id,
      plan_code: planCode, plan_name: plan.name, plan_months: plan.months,
      amount: plan.amount, currency: 'NPR',
      payment_code: code, sender_name: senderName,
      voucher_data_url: voucherDataUrl, voucher_original_filename: voucherMeta.name,
      voucher_mime_type: voucherMeta.type, voucher_size: voucherMeta.size,
      method: 'fonepay', status: PAYMENT_STATUS.PENDING,
      submitted_at: now.toISOString(), reviewed_at: null, reviewed_by: null,
      admin_rejection_reason: '', admin_note: '',
      verified_transaction_id: '', verified_amount: null, verified_sender_name: '',
      expires_at: new Date(now.getTime()+PAYMENT_VERIFY_WINDOW_MS).toISOString(),
      created_at: now.toISOString()
    };
    db.subscriptionPayments.push(rec);
    if (db.draftCodes) delete db.draftCodes[merchant.id+':'+planCode];
    logAudit(db, 'merchant:'+merchant.id, 'payment_submitted', rec.id, { payment_code: code, amount: plan.amount });
    return rec;
  },

  approve: function(db, paymentId, adminFields){
    var rec = db.subscriptionPayments.find(function(p){ return p.id===paymentId; });
    if (!rec) return { ok:false, message:'Payment request not found.' };
    if (rec.status !== PAYMENT_STATUS.PENDING) return { ok:false, message:'This request is no longer pending (already '+rec.status+').' };
    rec.status = PAYMENT_STATUS.APPROVED;
    rec.reviewed_at = nowISO(); rec.reviewed_by = 'Admin';
    rec.verified_transaction_id = (adminFields && adminFields.transactionId) || '';
    rec.verified_amount = (adminFields && adminFields.amount != null && adminFields.amount !== '') ? Number(adminFields.amount) : null;
    rec.verified_sender_name = (adminFields && adminFields.senderName) || '';
    rec.admin_note = (adminFields && adminFields.note) || '';
    var res = activatePaidSubscription(db, rec.merchant_id, rec.plan_code, 'Fonepay', rec.payment_code);
    logAudit(db, 'admin', 'payment_approved', rec.id, { payment_code: rec.payment_code });
    if (res.ok) logAudit(db, 'admin', 'subscription_activated', rec.id, { merchant_id: rec.merchant_id, license_code: res.code });
    return res.ok ? { ok:true } : { ok:false, message: res.message };
  },

  reject: function(db, paymentId, reason, note){
    var rec = db.subscriptionPayments.find(function(p){ return p.id===paymentId; });
    if (!rec) return { ok:false, message:'Payment request not found.' };
    if (rec.status !== PAYMENT_STATUS.PENDING) return { ok:false, message:'This request is no longer pending.' };
    rec.status = PAYMENT_STATUS.REJECTED;
    rec.reviewed_at = nowISO(); rec.reviewed_by = 'Admin';
    rec.admin_rejection_reason = reason; rec.admin_note = note || '';
    logAudit(db, 'admin', 'payment_rejected', rec.id, { reason: reason });
    return { ok:true };
  },

  /* Lazily expires stale requests whenever anyone loads data (merchant or admin) -- a static
     page has no server/cron to run this on a timer, so "expired" is computed on read instead.
     The observable result is the same: nobody ever sees a >24h-old request still PENDING. */
  expireStale: function(db){
    var now = Date.now(), changed = false;
    (db.subscriptionPayments||[]).forEach(function(p){
      if (p.method==='fonepay' && p.status===PAYMENT_STATUS.PENDING && p.expires_at && Date.parse(p.expires_at) < now){
        p.status = PAYMENT_STATUS.EXPIRED;
        logAudit(db, 'system', 'payment_expired', p.id, {});
        changed = true;
      }
    });
    return changed;
  }
};

function finalizePaidInvoice(db, m, invoiceId){
  var inv = db.invoices.find(function(x){ return x.invoice_id===invoiceId && x.merchant_id===m.id; });
  if (!inv) return;
  if (inv.status !== 'PAID') inv.status = 'PAID';
  if (inv.customer_phone){
    var cust = db.customers.find(function(c){ return c.merchant_id===m.id && c.phone===inv.customer_phone; });
    var earned = Math.floor(inv.total/100);
    if (cust){
      cust.points = (cust.points||0) + earned;
      cust.total_spent = (cust.total_spent||0) + inv.total;
      cust.name = inv.customer;
    } else {
      db.customers.push({ id: nextSeq(db,'customers'), merchant_id: m.id, name: inv.customer, phone: inv.customer_phone,
        points: earned, total_spent: inv.total, last_discount_date: '' });
    }
  }
}

/* Extends from current expiry if still active, else starts now — mirrors activate_paid_subscription(). */
function activatePaidSubscription(db, merchantId, planCode, paymentMethodLabel, referenceId){
  var merchant = findMerchantById(db, merchantId);
  if (!merchant) return { ok:false, message:'Merchant not found.' };
  var plan = SUBSCRIPTION_PLANS[planCode];
  if (!plan) return { ok:false, message:'Unknown subscription plan.' };
  var now = new Date();
  var start = now;
  if (merchant.license_expires_at){
    var old = new Date(merchant.license_expires_at);
    if (!isNaN(old.getTime()) && old.getTime() > now.getTime()) start = old;
  }
  var expires = new Date(start.getTime() + plan.months*30*24*60*60*1000);
  var code = makeLicenseCode();
  db.licenses.push({ id: nextSeq(db,'licenses'), code: code, code_hash: licenseHash(code), months: plan.months, days:0,
    status: 'USED', merchant_id: merchant.id, created_at: now.toISOString(), used_at: now.toISOString(), used_by_phone: merchant.phone });
  merchant.license_active = 1;
  merchant.license_code_hash = licenseHash(code);
  merchant.license_expires_at = expires.toISOString();
  merchant.license_plan = plan.name;
  merchant.verified = 1;
  db.subscriptionHistory.push({ id: nextSeq(db,'history'), merchant_id: merchant.id, plan_code: planCode, plan_name: plan.name,
    amount: plan.amount, payment_method: paymentMethodLabel, reference_id: referenceId||'', started_at: start.toISOString(),
    expires_at: expires.toISOString(), status: 'ACTIVE', created_at: now.toISOString() });
  return { ok:true, code: code, expires: expires.toISOString() };
}

/* Calendar-month-accurate expiry, matching Python's calendar.monthrange usage for demo accounts / admin key durations. */
function addCalendarMonths(date, months){
  var y = date.getFullYear(), m = date.getMonth(), d = date.getDate();
  var total = y*12 + m + months;
  var ny = Math.floor(total/12), nm = total%12;
  var lastDay = new Date(ny, nm+1, 0).getDate();
  return new Date(ny, nm, Math.min(d, lastDay), date.getHours(), date.getMinutes(), date.getSeconds());
}

function durationToExpiry(duration){
  var mapping = { '15days':[0,15], '1month':[1,0], '3months':[3,0], '12months':[12,0] };
  var pair = mapping[duration] || [1,0];
  var months = pair[0], days = pair[1];
  var now = new Date();
  if (months) return addCalendarMonths(now, months);
  return new Date(now.getTime() + days*24*60*60*1000);
}

/* ===== Billing math — VAT-inclusive selling prices; VAT = taxable * 13/113 ===== */
function computeBillTotals(items, useDiscount, customer){
  var subtotal = 0;
  items.forEach(function(it){ subtotal += (Number(it.quantity)||0) * (Number(it.price)||0); });
  subtotal = Math.round(subtotal*100)/100;
  var discount = 0;
  var today = todayISODate();
  if (useDiscount && customer && customer.points>=5000 && customer.last_discount_date !== today){
    discount = Math.round(subtotal*0.02*100)/100;
  }
  var taxable = Math.round((subtotal-discount)*100)/100;
  var vat = Math.round((taxable*VAT_RATE/(1+VAT_RATE))*100)/100;
  var total = taxable;
  return { subtotal:subtotal, discount:discount, taxable:taxable, vat:vat, total:total };
}

/* ===== Reports ===== */
function dailySalesAgg(db, merchantId, limit, tzName){
  var byDay = {};
  db.invoices.forEach(function(inv){
    if (inv.merchant_id===merchantId && inv.status==='PAID'){
      var day = localDateSlice(inv.created_at, tzName);
      if (!byDay[day]) byDay[day] = { day:day, bills:0, sales:0 };
      byDay[day].bills++; byDay[day].sales += inv.total;
    }
  });
  var rows = Object.values(byDay).sort(function(a,b){ return a.day<b.day?1:-1; });
  return limit ? rows.slice(0,limit) : rows;
}
function topProducts(db, merchantId, limit){
  var byProduct = {};
  var paidIds = {};
  db.invoices.forEach(function(inv){ if (inv.merchant_id===merchantId && inv.status==='PAID') paidIds[inv.invoice_id]=true; });
  db.items.forEach(function(it){
    if (paidIds[it.invoice_id]){
      if (!byProduct[it.product]) byProduct[it.product] = { product: it.product, qty:0, sales:0 };
      byProduct[it.product].qty += it.quantity; byProduct[it.product].sales += it.amount;
    }
  });
  var rows = Object.values(byProduct).sort(function(a,b){ return b.sales-a.sales; });
  return limit ? rows.slice(0,limit) : rows;
}

/* ================= Camera Barcode/QR Scanner =================
   Uses the standard BarcodeDetector API. On browsers that ship it natively
   (Chrome/Edge on Android and desktop -- the priority target here), it runs
   with zero extra downloads. On browsers that don't (Safari/iOS, Firefox),
   a small loader (see SCANNER_POLYFILL_SRC below) transparently registers a
   WebAssembly-backed implementation of the exact same API, so this file only
   has ONE code path rather than maintaining two parallel scanners.
   If neither is available (e.g. fully offline on a browser without native
   support), scanning is simply not offered and manual entry -- which already
   exists on every barcode field -- keeps working exactly as before. */

var SCANNER_FORMATS = ['qr_code','ean_13','ean_8','upc_a','upc_e','code_128','code_39'];
/* IIFE (classic script) build, not the ES-module build: module scripts always fetch in
   CORS mode per spec, which fails when this page is opened as a local file:// (its origin
   is opaque/"null" for that purpose) even though file:// otherwise counts as a secure
   context. A classic <script src> has no such restriction. */
var SCANNER_POLYFILL_SRC = 'https://fastly.jsdelivr.net/npm/barcode-detector@3/dist/iife/polyfill.min.js';
var _scannerPolyfillPromise = null;

function ensureBarcodeDetector(){
  if (typeof BarcodeDetector !== 'undefined') return Promise.resolve(true);
  if (!window.isSecureContext) return Promise.resolve(false);
  if (!_scannerPolyfillPromise){
    _scannerPolyfillPromise = new Promise(function(resolve){
      var s = document.createElement('script');
      s.src = SCANNER_POLYFILL_SRC;
      var settled = false;
      var finish = function(ok){ if (settled) return; settled = true; resolve(ok); };
      s.onload = function(){ finish(typeof BarcodeDetector !== 'undefined'); };
      s.onerror = function(){ finish(false); };
      setTimeout(function(){ finish(typeof BarcodeDetector !== 'undefined'); }, 8000);
      document.head.appendChild(s);
    });
  }
  return _scannerPolyfillPromise;
}

/* Shared scanner UI + lifecycle, used identically from Billing and from the
   Products/Add-Item form -- one implementation, two call sites, per the
   "avoid duplicating scanner logic" requirement. onDetected(value) is called
   at most once per scan session; the scanner is already stopped by the time
   it fires, so callers don't need to worry about it firing again. */
function openBarcodeScanner(onDetected){
  var overlay = document.createElement('div');
  overlay.id = 'scannerOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:#0b1520;z-index:9999;display:flex;flex-direction:column;color:#fff;font-family:inherit';
  overlay.innerHTML =
    '<div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#0b1520">'+
      '<b style="font-size:16px">Scan Barcode / QR</b>'+
      '<button type="button" id="scanCloseBtn" class="secondary" style="padding:8px 14px">✕ Close</button>'+
    '</div>'+
    '<div style="position:relative;flex:1;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center">'+
      '<video id="scanVideo" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover"></video>'+
      '<div id="scanFrame" style="position:absolute;left:12%;right:12%;top:28%;bottom:28%;border:3px solid #3c8cff;border-radius:16px;box-shadow:0 0 0 2000px rgba(0,0,0,.45);pointer-events:none"></div>'+
      '<div id="scanMsg" style="position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:14px;text-shadow:0 1px 3px #000">Starting camera…</div>'+
    '</div>'+
    '<div style="display:flex;gap:10px;justify-content:center;padding:14px 16px;background:#0b1520;flex-wrap:wrap">'+
      '<button type="button" id="scanTorchBtn" class="secondary hidden">🔦 Torch</button>'+
      '<button type="button" id="scanSwitchBtn" class="secondary hidden">🔄 Switch Camera</button>'+
    '</div>'+
    '<div id="scanManualWrap" style="padding:0 16px 16px;background:#0b1520">'+
      '<label style="color:#cfe0ff">Or enter the code manually</label>'+
      '<div class="row"><input id="scanManualInput" placeholder="Type barcode/QR value" style="color:#111">'+
      '<button type="button" id="scanManualBtn" style="flex:0 0 auto">Use This</button></div>'+
    '</div>';
  document.body.appendChild(overlay);

  var video = overlay.querySelector('#scanVideo');
  var msg = overlay.querySelector('#scanMsg');
  var torchBtn = overlay.querySelector('#scanTorchBtn');
  var switchBtn = overlay.querySelector('#scanSwitchBtn');
  var stream = null, track = null, detector = null, rafId = null, stopped = false;
  var torchOn = false, videoDevices = [], currentDeviceIndex = 0;
  var canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });

  function cleanup(){
    stopped = true;
    if (rafId) cancelAnimationFrame(rafId);
    if (stream) stream.getTracks().forEach(function(t){ t.stop(); });
    overlay.remove();
  }
  overlay.querySelector('#scanCloseBtn').addEventListener('click', cleanup);

  overlay.querySelector('#scanManualBtn').addEventListener('click', function(){
    var v = overlay.querySelector('#scanManualInput').value.trim();
    if (!v) return;
    cleanup();
    onDetected(v);
  });

  function finishWithValue(value){
    if (stopped) return;
    cleanup();
    onDetected(value);
  }

  function scanLoop(){
    if (stopped || !detector) return;
    if (video.readyState >= 2 && video.videoWidth > 0){
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      detector.detect(canvas).then(function(codes){
        if (stopped) return;
        if (codes && codes.length){
          finishWithValue(codes[0].rawValue);
          return;
        }
        rafId = requestAnimationFrame(scanLoop);
      }).catch(function(){
        rafId = requestAnimationFrame(scanLoop);
      });
    } else {
      rafId = requestAnimationFrame(scanLoop);
    }
  }

  function setupTorchButton(){
    try {
      var caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps && caps.torch){
        torchBtn.classList.remove('hidden');
        torchBtn.onclick = function(){
          torchOn = !torchOn;
          track.applyConstraints({ advanced: [{ torch: torchOn }] }).catch(function(){});
        };
      }
    } catch(e){ /* torch not supported here -- button stays hidden */ }
  }

  async function startCamera(deviceId){
    msg.textContent = 'Starting camera…';
    if (stream) stream.getTracks().forEach(function(t){ t.stop(); });
    var constraints = { video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: { ideal: 'environment' } } };
    stream = await navigator.mediaDevices.getUserMedia(constraints);
    track = stream.getVideoTracks()[0];
    video.srcObject = stream;
    await video.play().catch(function(){});
    setupTorchButton();
    msg.textContent = 'Point camera at barcode';
  }

  (async function init(){
    if (!window.isSecureContext){
      msg.textContent = 'Camera scanning needs a secure page (HTTPS or opening this file directly). Use manual entry below.';
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      msg.textContent = 'This browser cannot access the camera. Use manual entry below.';
      return;
    }
    var ready = await ensureBarcodeDetector();
    if (!ready){
      msg.textContent = 'Barcode scanning is not available in this browser. Use manual entry below.';
      return;
    }
    try {
      detector = new BarcodeDetector({ formats: SCANNER_FORMATS });
    } catch(e){
      msg.textContent = 'Could not start the scanner. Use manual entry below.';
      return;
    }
    try {
      await startCamera(null);
    } catch(e){
      if (e && (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError')){
        msg.textContent = 'Camera access is required to scan a barcode. You can allow camera access in your browser settings or enter the code manually.';
      } else if (e && e.name === 'NotFoundError'){
        msg.textContent = 'No camera was found on this device. Use manual entry below.';
      } else {
        msg.textContent = 'Could not start the camera. Use manual entry below.';
      }
      return;
    }
    try {
      var devices = await navigator.mediaDevices.enumerateDevices();
      videoDevices = devices.filter(function(d){ return d.kind === 'videoinput'; });
      if (videoDevices.length > 1){
        switchBtn.classList.remove('hidden');
        switchBtn.onclick = async function(){
          currentDeviceIndex = (currentDeviceIndex + 1) % videoDevices.length;
          try { await startCamera(videoDevices[currentDeviceIndex].deviceId); } catch(e){}
        };
      }
    } catch(e){ /* device list unavailable -- switch button just stays hidden */ }

    scanLoop();
  })();
}

  );
  function updateTimezones(){

    var phone = val('phone'), email = val('email').toLowerCase(), pw = qs('[name=password]',f).value;
    var enabled = qs('[name=fonepay_enabled]',f).checked ? 1 : 0;
    var fmid = val('fonepay_merchant_id'), furl = val('fonepay_api_url'), fkey = val('fonepay_api_key'),

        vurl = val('fonepay_verify_url'), vmethod = val('fonepay_verify_method') || 'POST',

    if (email.indexOf('@')===-1){ renderSignup(params,{error:'Enter a valid email address.'}); return; }
    if (pw.length<6){ renderSignup(params,{error:'Password must be at least 6 characters.'}); return; }
    if (enabled && !(fmid&&furl&&fkey&&fsecret&&vurl)){ renderSignup(params,{error:'Complete all Fonepay fields or leave Fonepay disabled.'}); return; }
    var db = loadDB();
    var dup = db.merchants.find(function(m){ return m.pan===pan || m.phone===phone || String(m.email||'').toLowerCase()===email; });
    if (dup){ renderSignup(params,{error:'That PAN, phone number, or email is already registered.'}); return; }
    var id = nextSeq(db,'merchants');

      id:id, business_name:name, pan:pan, location:loc, country:country, timezone:tzName, phone:phone, email:email,
      password_hash: hashPassword(pw), fonepay_enabled: enabled, fonepay_merchant_id: fmid, fonepay_api_url: furl,
      fonepay_api_key: fkey, fonepay_api_secret: fsecret, fonepay_verify_url: vurl, fonepay_verify_method: vmethod,
      fonepay_verify_field: vfield, license_active:0, license_code_hash:'', license_expires_at:'', license_plan:'',
      verified:0, verification_status:'PENDING', is_demo:0
    });
    saveDB(db);
    setSession({ merchant_id: id });
    go('#/subscribe');
  });

function renderSubscribePay(params){

/* Fonepay: real QR + a short code the merchant puts in the Fonepay remarks field.
   No self-activation button here on purpose — only the admin's approval (after checking
   their real Fonepay statement) can activate this, since a self-serve button would let
   anyone skip paying entirely. */
function renderSubscribePayFonepay(m, plan, planCode){
  var db = loadDB();
  ManualVerificationProvider.expireStale(db);
  saveDB(db);

  // Duplicate protection: one active pending Fonepay request per merchant, across all plans.
  var activePending = ManualVerificationProvider.findActivePendingForMerchant(db, m.id);
  if (activePending){ renderFonepayPendingStatus(m, activePending); return; }

  var freshMerchant = findMerchantById(db, m.id);
  if (licenseValid(freshMerchant)) { go('#/'); return; }

  var code = ManualVerificationProvider.getOrCreateDraftCode(db, m.id, planCode);
  saveDB(db);

  // If their most recent resolved request was rejected/expired, show that context up top.
  var lastResolved = db.subscriptionPayments
    .filter(function(p){ return p.merchant_id===m.id && p.method==='fonepay' && (p.status===PAYMENT_STATUS.REJECTED || p.status===PAYMENT_STATUS.EXPIRED); })
    .sort(function(a,b){ return b.id-a.id; })[0];
  var noticeHtml = '';
  if (lastResolved){
    if (lastResolved.status === PAYMENT_STATUS.REJECTED){
      noticeHtml = '<p class="err">Your previous submission (code '+escapeHtml(lastResolved.payment_code)+') was rejected: '+escapeHtml(lastResolved.admin_rejection_reason||'No reason given')+
        (lastResolved.admin_note?' — '+escapeHtml(lastResolved.admin_note):'')+'. You can submit a new payment below.</p>';
    } else {
      noticeHtml = '<p class="err">This payment verification request has expired. It does not necessarily mean your payment failed — if you already paid, submit again below with your voucher so it can be checked.</p>';
    }
  }

  var qrImg = REAL_FONEPAY_QR_DATA_URI
    ? '<img class="qr-thumb" style="width:240px;height:240px" src="'+REAL_FONEPAY_QR_DATA_URI+'" alt="Fonepay payment QR">'
    : '<p class="err">No Fonepay QR has been configured yet. Contact the platform owner.</p>';

  renderShell(
    '<div class="box wide">'+brandHeader()+
    '<h1 class="center">Pay with Fonepay</h1>'+
    noticeHtml+
    '<div class="card"><h3 style="margin-top:0">Subscription Summary</h3>'+
      '<div class="row"><div><div class="small">Package</div><b>'+escapeHtml(plan.name)+'</b></div>'+
      '<div><div class="small">Amount</div><b>Rs '+fmt2(plan.amount)+'</b></div></div>'+
    '</div>'+
    '<div class="card center">'+qrImg+
      '<p style="font-weight:700;margin-top:8px">Pay exactly Rs '+fmt2(plan.amount)+'</p>'+
      '<p class="small">This is the platform owner\'s real Fonepay QR — it does not automatically identify your payment. The Billo Payment Code below is what identifies your specific request.</p>'+
      '<p class="small">After completing the payment, enter the Billo Payment Code shown below in the Remarks field of your payment.</p>'+
      '<div class="small" style="font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--billo-muted);margin-top:14px">Billo Payment Code</div>'+
      '<div style="font-size:30px;font-weight:800;letter-spacing:2px;background:#eef6ff;border:2px dashed var(--billo-blue);border-radius:12px;padding:14px;margin:8px 0">'+escapeHtml(code)+'</div>'+
      '<button type="button" id="copyCodeBtn" class="secondary">Copy Code</button>'+
      '<p class="small">Please enter this exact code in the Remarks field when making your payment.</p>'+
    '</div>'+
    '<div class="card">'+
      '<h3 style="margin-top:0">Upload Payment Voucher</h3>'+
      '<p class="small">A screenshot or photo of the "payment successful" confirmation from Fonepay. JPG, PNG, or WEBP, up to 10 MB.</p>'+
      '<input type="file" accept="image/jpeg,image/png,image/webp" id="proofFile">'+
      '<div id="proofPreviewWrap" class="hidden" style="margin-top:8px">'+
        '<img id="proofPreview" style="max-width:200px;border:1px solid var(--billo-border);border-radius:8px;display:block">'+
        '<div class="small" id="proofMeta"></div>'+
      '</div>'+
      '<div id="uploadErr" class="err"></div>'+
      '<label>Sender\'s Name</label>'+
      '<p class="small" style="margin-top:-4px">Enter the name registered on the payment account used to send the payment.</p>'+
      '<input id="senderName" placeholder="e.g. Ram Bahadur">'+
      '<label style="font-weight:400;margin-top:14px"><input type="checkbox" id="confirmCheck" class="chip-input"> '+
        'I confirm that I have completed the payment using the information shown above and that the uploaded voucher belongs to this payment.</label>'+
      '<button type="button" id="submitProofBtn" disabled style="margin-top:12px">Submit Payment for Verification</button>'+
    '</div>'+
    '<p class="center" style="margin-top:10px"><a href="#/subscribe">Cancel / choose a different plan</a></p>'+
    '</div>'
  );

  qs('#copyCodeBtn').addEventListener('click', function(){ copyToClipboardFallback(code); });

  var compressed = null, fileMeta = null;
  function refreshSubmitEnabled(){
    qs('#submitProofBtn').disabled = !(compressed && qs('#senderName').value.trim() && qs('#confirmCheck').checked);
  }
  qs('#proofFile').addEventListener('change', function(e){
    var file = e.target.files[0];
    var errEl = qs('#uploadErr'); errEl.textContent = '';
    compressed = null; refreshSubmitEnabled();
    if (!file) return;
    fileMeta = { name: file.name, type: file.type, size: file.size };
    compressImageFile(file, 1100, 0.72).then(function(dataUrl){
      compressed = dataUrl;
      qs('#proofPreview').src = dataUrl;
      qs('#proofMeta').textContent = file.name+' ('+humanFileSize(file.size)+')';
      qs('#proofPreviewWrap').classList.remove('hidden');
      refreshSubmitEnabled();
    }).catch(function(err){ errEl.textContent = err.message; });
  });
  qs('#senderName').addEventListener('input', refreshSubmitEnabled);
  qs('#confirmCheck').addEventListener('change', refreshSubmitEnabled);

  qs('#submitProofBtn').addEventListener('click', function(){
    var name = qs('#senderName').value.trim();
    var errEl = qs('#uploadErr');
    if (!compressed){ errEl.textContent = 'Upload your payment voucher first.'; return; }
    if (!name){ errEl.textContent = "Enter the sender's name."; return; }
    if (!qs('#confirmCheck').checked){ errEl.textContent = 'Please check the confirmation box.'; return; }
    var db2 = loadDB();
    // Re-check duplicate protection at submit time too, not just at page-load time.
    if (ManualVerificationProvider.findActivePendingForMerchant(db2, m.id)){
      toast('You already have a pending request.'); go('#/subscribe-pay/'+planCode+'/fonepay'); return;
    }
    var rec = ManualVerificationProvider.submit(db2, m, plan, planCode, code, compressed, fileMeta, name);
    var ok = saveDB(db2);
    if (!ok){ errEl.textContent = 'Could not save — your image may be too large. Try a smaller photo.'; return; }
    renderFonepayPendingStatus(m, rec);
  });
}

function fonepayStatusBadge(status){
  var cls = status===PAYMENT_STATUS.APPROVED ? 'ok' : (status===PAYMENT_STATUS.PENDING ? '' : 'err');
  return '<span class="'+cls+'" style="font-weight:800">'+escapeHtml(status)+'</span>';
}

function renderFonepayPendingStatus(m, rec){
  var db = loadDB();
  var fresh = db.subscriptionPayments.find(function(p){ return p.id===rec.id; }) || rec;
  var mm = findMerchantById(db, m.id);
  if (licenseValid(mm) && fresh.status===PAYMENT_STATUS.APPROVED){ /* fall through to show approved screen once, then they can proceed */ }

  var body = '';
  if (fresh.status === PAYMENT_STATUS.PENDING){
    body =
      '<p id="payStatus" class="ok" style="font-weight:700;font-size:16px">Payment Submitted</p>'+
      '<p class="small">Your payment is currently being verified by Billo Admin. Verification may take up to 24 hours.</p>';
  } else if (fresh.status === PAYMENT_STATUS.APPROVED){
    body =
      '<p style="font-weight:700;font-size:16px" class="ok">✅ Payment Verified</p>'+
      '<p>Your Billo subscription is now active.</p>'+
      '<p><a href="#/"><button type="button">Open POS</button></a></p>';
  } else if (fresh.status === PAYMENT_STATUS.REJECTED){
    body =
      '<p style="font-weight:700;font-size:16px" class="err">Payment Rejected</p>'+
      '<p>Your Billo subscription payment was rejected.</p>'+
      '<p><b>Reason:</b> '+escapeHtml(fresh.admin_rejection_reason||'Not specified')+(fresh.admin_note?'<br><b>Note:</b> '+escapeHtml(fresh.admin_note):'')+'</p>'+
      '<p><a href="#/subscribe-pay/'+fresh.plan_code+'/fonepay"><button type="button">Submit a New Payment</button></a></p>';
  } else if (fresh.status === PAYMENT_STATUS.EXPIRED){
    body =
      '<p style="font-weight:700;font-size:16px" class="err">Verification Request Expired</p>'+
      '<p class="small">This only means the 24-hour Billo verification window closed — it does not necessarily mean your payment failed. If you already paid, submit again with your voucher.</p>'+
      '<p><a href="#/subscribe-pay/'+fresh.plan_code+'/fonepay"><button type="button">Submit Again</button></a></p>';
  }

  renderShell(
    '<div class="box">'+brandHeader()+
    '<h1 class="center">Fonepay Payment Status</h1>'+
    '<div class="card center">'+body+'</div>'+
    '<div class="card"><h3 style="margin-top:0">Details</h3>'+
    '<table><tr><td>Payment Code</td><td><b>'+escapeHtml(fresh.payment_code)+'</b></td></tr>'+
    '<tr><td>Package</td><td>'+escapeHtml(fresh.plan_name)+'</td></tr>'+
    '<tr><td>Amount</td><td>Rs '+fmt2(fresh.amount)+'</td></tr>'+
    '<tr><td>Sender Name</td><td>'+escapeHtml(fresh.sender_name)+'</td></tr>'+
    '<tr><td>Submitted At</td><td>'+escapeHtml(fresh.submitted_at)+'</td></tr>'+
    '<tr><td>Status</td><td>'+fonepayStatusBadge(fresh.status)+'</td></tr>'+
    (fresh.reviewed_at ? '<tr><td>Reviewed At</td><td>'+escapeHtml(fresh.reviewed_at)+'</td></tr>' : '')+
    '</table></div>'+
    (fresh.status===PAYMENT_STATUS.PENDING ? '<div class="center"><button type="button" id="checkStatusBtn" class="secondary">Check Status</button></div>' : '')+
    '<p class="center" style="margin-top:10px"><a href="#/subscribe">Back to Subscription Plans</a></p>'+
    '</div>'
  );
  if (fresh.status===PAYMENT_STATUS.PENDING){
    qs('#checkStatusBtn').addEventListener('click', function(){
      var db2 = loadDB();
      ManualVerificationProvider.expireStale(db2); saveDB(db2);
      var mm2 = findMerchantById(db2, m.id);
      if (licenseValid(mm2)) { go('#/'); return; }
      var rec2 = db2.subscriptionPayments.find(function(p){ return p.id===fresh.id; });
      renderFonepayPendingStatus(m, rec2 || fresh);
    });
  }
}

function renderActivate(params, opts){
  opts = opts || {};
  var m = currentMerchant();
  if (!m){ go('#/login'); return; }
  if (licenseValid(m)){ go('#/'); return; }
  renderShell(
    '<div class="box">'+brandHeader()+
    '<h1>🔑 Activate POS</h1><p>'+escapeHtml(m.business_name)+'</p>'+
    '<p>Enter the validity key given by the platform owner.</p>'+
    (opts.error ? '<p class="err">'+escapeHtml(opts.error)+'</p>' : '')+
    '<form id="activateForm"><input name="license_key" placeholder="POS-XXXXXXXXXXXXXXXX" required style="text-transform:uppercase">'+
    '<button type="submit">Activate</button></form>'+
    '<p><a href="#/logout">Logout</a></p>'+
    '</div>'
  );
  qs('#activateForm').addEventListener('submit', function(e){
    e.preventDefault();
    var code = qs('[name=license_key]', e.target).value.trim().toUpperCase();
    var db = loadDB();
    var hash = licenseHash(code);
    var lic = db.licenses.find(function(l){ return l.code_hash===hash && l.status==='UNUSED'; });
    if (!lic){ renderActivate(params, {error:'Invalid or already-used key.'}); return; }
    var mm = findMerchantById(db, m.id);
    if (!mm){ go('#/login'); return; }
    var now = new Date();
    var expires = new Date(now.getTime() + ((lic.days && lic.days>0) ? lic.days : 30*lic.months) * 24*60*60*1000);
    lic.status = 'USED'; lic.merchant_id = mm.id; lic.used_at = now.toISOString(); lic.used_by_phone = mm.phone;
    mm.license_active = 1; mm.license_code_hash = lic.code_hash; mm.license_expires_at = expires.toISOString();
    mm.license_plan = lic.code; mm.verified = 1;
    var planName, planCode;
    if (lic.days && lic.days>0){ planName = lic.days+' Days'; planCode = lic.days+'days'; }
    else { planName = lic.months+(lic.months===1?' Month':' Months'); planCode = ({1:'1month',3:'3months',12:'12months'})[lic.months] || String(lic.months); }
    db.subscriptionHistory.push({ id: nextSeq(db,'history'), merchant_id:mm.id, plan_code:planCode, plan_name:planName, amount:0,
      payment_method:'Validity Key', reference_id: code, started_at: now.toISOString(), expires_at: expires.toISOString(),
      status:'ACTIVE', created_at: now.toISOString() });
    saveDB(db);
    go('#/');
  });
}

  var history = db.subscriptionHistory.filter(function(h){return h.merchant_id===m.id;}).sort(function(a,b){return b.id-a.id;});

    (history.length? history.map(function(h){

    (bills.length? bills.map(function(b){
      return '<tr><td>'+pad3(b.bill_no)+'</td><td>'+escapeHtml(b.invoice_id)+'</td><td>Rs '+fmt2(b.total)+'</td><td>'+escapeHtml(b.payment_method)+'</td><td>'+escapeHtml(b.status)+'</td><td>'+escapeHtml(b.created_at)+'</td></tr>';
    }).join('') : '<tr><td colspan="6">No bills yet.</td></tr>')+

  );
}

    '<div class="loyalty-box" id="loyaltyStatus">Enter customer phone number to check loyalty.</div>'+
    '<label style="font-weight:400"><input id="useDiscount" type="checkbox" class="chip-input" disabled> Use today\'s 2% loyalty discount (5,000+ points)</label>'+

    '<h3 style="margin-top:18px">Items</h3>'+
    '<div class="row"><input id="barcodeScan" placeholder="Scan barcode here and press Enter" autocomplete="off">'+
    '<button type="button" id="scanCamBtn" class="secondary" style="flex:0 0 auto" title="Scan with camera">📷 Scan</button>'+
    '<button type="button" id="findItemBtn" style="flex:0 0 auto">Find Item</button></div>'+
    '<p class="small">Scan a registered barcode with a USB/Bluetooth scanner, or type it and press Enter / Find Item. The item name and price fill in automatically.</p>'+
    '<div class="grid-items hdr"><div>S.N.</div><div>Product</div><div>Qty</div><div>Price</div><div>Amount</div><div></div></div>'+
    '<div id="items"></div>'+
    '<button type="button" id="addItemBtn" class="secondary">+ Add item</button>'+
    '<p class="small">Prices are entered as the selling price. Selling prices are VAT-inclusive. Billo extracts VAT at 13% from the final taxable amount (VAT = amount × 13/113).</p>'+
    '<div class="total-box">Goods value (VAT-inclusive): NPR <span id="sub">0.00</span><br>'+
    'Loyalty discount: NPR <span id="discount">0.00</span><br>'+
    'VATable amount: NPR <span id="vatable">0.00</span><br>'+
    'VAT 13%: NPR <span id="vatAmount">0.00</span><br>'+
    'Grand Total: NPR <b id="total">0.00</b></div>'+

    '<div class="row" style="margin-top:14px"><select id="method"><option value="cash">Cash</option><option value="fonepay">Fonepay Dynamic QR</option></select>'+
    '<button type="button" id="createBillBtn">Create Bill</button></div>'+
    '<div id="message" style="font-weight:700"></div>'+

    '<div id="pay" class="pay-panel"><h2>Scan to Pay</h2><img id="qr" class="qr-thumb" style="width:220px;height:220px">'+
    '<p>Bill No: <b id="inv"></b></p><p>Amount: NPR <b id="amt"></b></p>'+
    '<p id="qrNote" class="small">Fonepay payment QR status will appear here.</p>'+
    '<button type="button" id="confirmPayBtn">Simulate Successful Payment</button></div>'+
    '</div>'+

    '<div class="card"><h2>Loyalty</h2><p class="small">1 point per NPR 100 paid.</p>'+
    '<button type="button" id="showLoyaltyBtn" class="secondary">View Customers &amp; Points</button>'+
    '<div id="loyaltyList"></div></div>'
  );

  var customerEl = qs('#customer'), phoneEl = qs('#phone'), methodEl = qs('#method'), itemsEl = qs('#items'),
      payEl = qs('#pay'), messageEl = qs('#message'), nextBillEl = qs('#nextBill'), qrEl = qs('#qr'),
      invEl = qs('#inv'), amtEl = qs('#amt'), useDiscountEl = qs('#useDiscount');
  var currentInvoice = '';

  function loadNextBill(){
    var db = loadDB();
    nextBillEl.textContent = pad3(nextBillNo(db, m.id));
  }

  function renumber(){ qsa('.item-line', itemsEl).forEach(function(row,i){ qs('.sn',row).textContent = i+1; }); }

  function calculate(){
    var subtotal = 0;
    qsa('.item-line', itemsEl).forEach(function(row){
      var q = parseFloat(qs('.qty',row).value)||0, p = parseFloat(qs('.price',row).value)||0;
      var amount = q*p; qs('.amount',row).value = amount.toFixed(2); subtotal += amount;
    });
    var discount = useDiscountEl.checked ? subtotal*0.02 : 0;
    var taxable = subtotal - discount;
    var vat = taxable*13/113;
    qs('#sub').textContent = subtotal.toFixed(2);
    qs('#discount').textContent = discount.toFixed(2);
    qs('#vatable').textContent = (taxable-vat).toFixed(2);
    qs('#vatAmount').textContent = vat.toFixed(2);
    qs('#total').textContent = taxable.toFixed(2);
  }

  function addItem(productName, productPrice){
    var d = document.createElement('div');
    d.className = 'grid-items item-line';
    d.innerHTML =
      '<div class="sn"></div>'+
      '<input type="hidden" class="product_id">'+
      '<input class="product" placeholder="Product">'+
      '<input class="qty" type="number" min="0.01" step="0.01" value="1">'+
      '<input class="price price-cell" type="number" min="0" step="0.01" placeholder="Price">'+
      '<input class="amount amount-cell" readonly placeholder="0.00">'+
      '<button type="button" class="remove secondary remove-cell" style="padding:8px">×</button>';
    qs('.product',d).value = productName||''; qs('.price',d).value = productPrice||'';
    qs('.remove',d).addEventListener('click', function(){ d.remove(); renumber(); calculate(); });
    qsa('input',d).forEach(function(el){ el.addEventListener('input', calculate); });
    itemsEl.appendChild(d);
    renumber(); calculate();
  }

  function lookupBarcode(){
    var scan = qs('#barcodeScan');
    var barcode = scan.value.trim();
    if (!barcode) return;
    var db = loadDB();
    var p = db.products.find(function(x){ return x.merchant_id===m.id && x.barcode===barcode; });
    if (!p){ messageEl.textContent = 'Barcode not found. Add it in Products/Barcodes first.'; scan.select(); return; }
    var rows = qsa('.item-line', itemsEl);
    var empty = rows.find(function(row){ return !qs('.product',row).value.trim(); });
    if (!empty){ addItem(p.name, p.price); rows = qsa('.item-line', itemsEl); empty = rows[rows.length-1]; }
    qs('.product',empty).value = p.name;
    qs('.product_id',empty).value = p.id||'';
    qs('.price',empty).value = Number(p.price).toFixed(2);
    qs('.qty',empty).focus();
    calculate(); scan.value = '';
    messageEl.textContent = 'Scanned: '+p.name;
  }
  qs('#barcodeScan').addEventListener('keydown', function(e){ if (e.key==='Enter'){ e.preventDefault(); lookupBarcode(); } });
  qs('#findItemBtn').addEventListener('click', lookupBarcode);
  qs('#scanCamBtn').addEventListener('click', function(){
    openBarcodeScanner(function(value){
      qs('#barcodeScan').value = value;
      lookupBarcode();
    });
  });
  qs('#addItemBtn').addEventListener('click', function(){ addItem(); });

  var loyaltyTimer;
  function checkLoyalty(){
    var phone = phoneEl.value.trim(); var box = qs('#loyaltyStatus');
    useDiscountEl.checked = false; useDiscountEl.disabled = true;
    if (!phone){ box.textContent = 'Enter customer phone number to check loyalty.'; calculate(); return; }
    var db = loadDB();
    var cust = db.customers.find(function(c){ return c.merchant_id===m.id && c.phone===phone; });
    if (!cust){ box.textContent = 'New customer — 0 points.'; calculate(); return; }
    customerEl.value = cust.name;
    var today = todayISODate();
    var discountAvailable = cust.last_discount_date !== today;
    if (cust.points>=5000){
      box.textContent = 'Customer: '+cust.name+' | Points: '+cust.points+' | '+(discountAvailable?'2% discount available today.':'2% discount already used today.');
      useDiscountEl.disabled = !discountAvailable;
    } else {
      box.textContent = 'Customer: '+cust.name+' | Points: '+cust.points+' | Need '+(5000-cust.points)+' more points for the 2% discount.';
    }
    calculate();
  }
  phoneEl.addEventListener('input', function(){ clearTimeout(loyaltyTimer); loyaltyTimer = setTimeout(checkLoyalty, 300); });
  useDiscountEl.addEventListener('change', calculate);

  function createBill(){
    messageEl.textContent = '';
    var rows = qsa('.item-line', itemsEl);
    if (!rows.length){ messageEl.textContent = 'Add at least one product.'; return; }
    var itemsInput = rows.map(function(row){
      return { product: qs('.product',row).value.trim(), quantity: qs('.qty',row).value, price: qs('.price',row).value, product_id: qs('.product_id',row).value };
    });
    // ---- mirrors POST /api/bill ----
    var customer = customerEl.value.trim() || 'Walk-in Customer';
    var phone = phoneEl.value.trim();
    var method = methodEl.value;
    var useDiscount = useDiscountEl.checked;
    var db = loadDB();
    var parsedItems = [], subtotalCheck = 0;
    for (var i=0;i<itemsInput.length;i++){
      var x = itemsInput[i];
      var qty = parseFloat(x.quantity), price = parseFloat(x.price);
      if (!x.product || !(qty>0) || !(price>=0) || isNaN(qty) || isNaN(price)){
        messageEl.textContent = 'Invalid item '+(i+1)+'.'; return;
      }
      var amount = Math.round(qty*price*100)/100;
      parsedItems.push({ sn:i+1, product_id: x.product_id?parseInt(x.product_id,10):null, product:x.product, quantity:qty, price:price, amount:amount });
      subtotalCheck += amount;
    }
    var cust = phone ? db.customers.find(function(c){return c.merchant_id===m.id && c.phone===phone;}) : null;
    var totals = computeBillTotals(parsedItems.map(function(it){return {quantity:it.quantity, price:it.price};}), useDiscount, cust);
    var billNo = nextBillNo(db, m.id);
    var iid = uuidv4();
    var status = (method==='cash') ? 'PAID' : 'PENDING';
    var invoice = { id: nextSeq(db,'invoices'), merchant_id:m.id, bill_no:billNo, invoice_id:iid, customer:customer,
      customer_phone: phone, subtotal: totals.subtotal, discount: totals.discount, discount_percent: totals.discount?2:0,
      vat: totals.vat, total: totals.total, payment_method: method, status: status, created_at: nowISO() };
    db.invoices.push(invoice);
    parsedItems.forEach(function(it){
      db.items.push({ invoice_id: iid, sn: it.sn, product: it.product, quantity: it.quantity, price: it.price, amount: it.amount, product_id: it.product_id, cost_price:0 });
    });
    var today = todayISODate();
    if (phone){
      if (!cust){ db.customers.push({ id: nextSeq(db,'customers'), merchant_id:m.id, name:customer, phone:phone, points:0, total_spent:0, last_discount_date:'' }); }
    }
    if (status === 'PAID'){ finalizePaidInvoice(db, m, iid); }
    if (totals.discount && phone){
      var custRow = db.customers.find(function(c){return c.merchant_id===m.id && c.phone===phone;});
      if (custRow) custRow.last_discount_date = today;
    }
    saveDB(db);

    currentInvoice = iid;
    if (status === 'PAID'){
      messageEl.textContent = 'Bill '+pad3(billNo)+' created. Opening print…';
      openPrintWindow(iid);
      resetBill();
      return;
    }
    // fonepay pending — show demo/placeholder QR exactly like the original api_bill response branches
    var qrText, note;
    if (!m.fonepay_enabled){
      qrText = 'FONEPAY-DEMO|merchant='+m.business_name+'|amount='+fmt2(totals.total)+'|bill='+pad3(billNo)+'|invoice='+iid;
      note = 'Demo QR only. Configure an approved Fonepay integration to use live QR.';
    } else {
      qrText = 'FONEPAY-INTEGRATION-PLACEHOLDER|merchant='+(m.fonepay_merchant_id||'')+'|amount='+fmt2(totals.total)+'|bill='+pad3(billNo)+'|invoice='+iid;
      note = 'Fonepay credentials saved. The official API request/signature adapter is still required.';
    }
    payEl.style.display = 'block';
    qrEl.src = qrDataURL(qrText, {moduleSize:6, margin:3});
    invEl.textContent = pad3(billNo);
    amtEl.textContent = fmt2(totals.total);
    qs('#qrNote').textContent = note;
    messageEl.textContent = 'Bill '+pad3(billNo)+' created. Waiting for payment.';
  }
  qs('#createBillBtn').addEventListener('click', createBill);

  qs('#confirmPayBtn').addEventListener('click', function(){
    if (!currentInvoice) return;
    var db = loadDB();
    var inv = db.invoices.find(function(x){ return x.invoice_id===currentInvoice && x.merchant_id===m.id; });
    if (!inv){ messageEl.textContent = 'Invoice not found.'; return; }
    if (inv.status !== 'PAID') finalizePaidInvoice(db, m, currentInvoice);
    saveDB(db);
    openPrintWindow(currentInvoice);
    resetBill();
  });

  function resetBill(){
    customerEl.value = ''; phoneEl.value = ''; itemsEl.innerHTML = ''; payEl.style.display = 'none';
    currentInvoice = ''; useDiscountEl.checked = false; useDiscountEl.disabled = true;
    qs('#loyaltyStatus').textContent = 'Enter customer phone number to check loyalty.';
    addItem(); loadNextBill();
  }

  qs('#showLoyaltyBtn').addEventListener('click', function(){
    var db = loadDB();
    var rows = db.customers.filter(function(c){return c.merchant_id===m.id;}).sort(function(a,b){return b.points-a.points;});
    var box = qs('#loyaltyList');
    box.innerHTML = '<hr>'+(rows.length ? rows.map(function(c){
      return '<div><b>'+escapeHtml(c.name)+'</b> — '+escapeHtml(c.phone)+' — '+c.points+' points — NPR '+fmt2(c.total_spent)+'</div>';
    }).join('') : 'No customers yet.');
  });

  addItem();
  loadNextBill();
}

/* ================= Print / Receipt ================= */

function buildReceiptInnerHTML(invoice, items, business, customer, displayDate){
  var rows = items.map(function(x){
    return '<tr><td>'+x.sn+'</td><td>'+escapeHtml(x.product)+'</td><td>'+x.quantity+'</td><td class="r">'+fmt2(x.price)+'</td><td class="r">'+fmt2(x.amount)+'</td></tr>';
  }).join('');
  return (
    '<div class="center">'+
      '<h1>TAX INVOICE</h1>'+
      '<b>'+escapeHtml(business.name)+'</b><br>'+
      escapeHtml(business.location)+'<br>'+
      'PAN: '+escapeHtml(business.pan)+'<br>'+
      (business.phone ? 'Phone: '+escapeHtml(business.phone) : '') + (business.email ? ' | '+escapeHtml(business.email) : '')+
    '</div>'+
    '<div class="rline"></div>'+
    '<div class="meta">'+
      '<div><b>Invoice No.:</b> '+pad3(invoice.bill_no)+'</div>'+
      '<div><b>Transaction Date:</b> '+escapeHtml(displayDate)+'</div>'+
      '<div><b>Invoice ID:</b> '+escapeHtml(invoice.invoice_id)+'</div>'+
      '<div><b>Invoice Issue Date:</b> '+escapeHtml(displayDate)+'</div>'+
      '<div><b>Buyer Name:</b> '+escapeHtml(invoice.customer || 'Walk-in Customer')+'</div>'+
      '<div><b>Payment:</b> '+escapeHtml(String(invoice.payment_method||'').toUpperCase())+'</div>'+
    '</div>'+
    '<div class="rline"></div>'+
    '<table><tr><th style="width:8%">S.N.</th><th>Details</th><th style="width:12%">Qty</th><th style="width:20%">Per Unit<br>Rs.</th><th style="width:22%">Total Amount<br>Rs.</th></tr>'+rows+'</table>'+
    '<div class="rline"></div>'+
    '<table>'+
      '<tr><td colspan="4" class="r"><b>Total Amount</b></td><td class="r">'+fmt2(invoice.subtotal)+'</td></tr>'+
      '<tr><td colspan="4" class="r">Discount</td><td class="r">'+fmt2(invoice.discount)+'</td></tr>'+
      '<tr><td colspan="4" class="r">Net Amount</td><td class="r">'+fmt2(invoice.total)+'</td></tr>'+
      '<tr><td colspan="4" class="r">VATable Amount</td><td class="r">'+fmt2(invoice.total-invoice.vat)+'</td></tr>'+
      '<tr><td colspan="4" class="r">VAT 13%</td><td class="r">'+fmt2(invoice.vat)+'</td></tr>'+
      '<tr><td colspan="4" class="r big">Grand Total</td><td class="r big">'+fmt2(invoice.total)+'</td></tr>'+
    '</table>'+
    (customer ? '<div class="small center">Loyalty Points: '+customer.points+'</div>' : '')+
    '<div class="center small">Thank you for your business.</div>'
  );
}

function loadInvoiceForPrint(invoiceId){
  var db = loadDB();
  var inv = db.invoices.find(function(x){ return x.invoice_id===invoiceId; });
  if (!inv) return null;
  var m = findMerchantById(db, inv.merchant_id);
  var items = db.items.filter(function(x){ return x.invoice_id===invoiceId; }).sort(function(a,b){return a.sn-b.sn;});
  var customer = null;
  if (inv.customer_phone) customer = db.customers.find(function(c){ return c.merchant_id===inv.merchant_id && c.phone===inv.customer_phone; }) || null;
  var business = m ? { name:m.business_name, pan:m.pan, location:m.location, country:m.country, timezone:m.timezone } : { name:'', pan:'', location:'', country:'' };
  var displayDate = formatBillDateTime(inv.created_at, m ? m.timezone : 'Asia/Kathmandu');
  return { invoice: inv, items: items, business: business, customer: customer, displayDate: displayDate };
}

function buildStandaloneReceiptDocument(data){
  var inner = buildReceiptInnerHTML(data.invoice, data.items, data.business, data.customer, data.displayDate);
  return '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+
    '<title>Tax Invoice '+data.invoice.bill_no+'</title><style>'+
    'body{font-family:Arial,sans-serif;width:80mm;margin:auto;font-size:11px;padding:7px;border:1px solid #111;color:#111}'+
    'h1{font-size:18px;margin:0 0 4px}.center{text-align:center}.rline{border-top:1px solid #111;margin:7px 0}'+
    '.meta{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px}.meta div{min-height:15px}'+
    'table{width:100%;border-collapse:collapse;margin-top:5px}th,td{border:1px solid #111;padding:3px 2px;vertical-align:top}th{font-size:10px}.r{text-align:right}.big{font-size:14px;font-weight:bold}.small{font-size:9px}'+
    '@media print{button{display:none}body{border:1px solid #111;margin:0 auto}}'+
    '</style></head><body>'+inner+
    '<div class="center" style="margin-top:10px"><button onclick="window.print()">Print</button></div>'+
    '<scr'+'ipt>window.onload=function(){setTimeout(function(){window.print();},150);};</scr'+'ipt>'+
    '</body></html>';
}

function openPrintWindow(invoiceId){
  var data = loadInvoiceForPrint(invoiceId);
  if (!data){ toast('Invoice not found.'); return; }
  var html = buildStandaloneReceiptDocument(data);
  try {
    var blob = new Blob([html], { type: 'text/html' });
    var url = URL.createObjectURL(blob);
    var win = window.open(url, '_blank');
    if (!win){
      // Popup blocked — fall back to the in-app print route in the same tab.
      go('#/print/'+invoiceId);
    } else {
      setTimeout(function(){ URL.revokeObjectURL(url); }, 30000);
    }
  } catch(e){
    go('#/print/'+invoiceId);
  }
}

function renderPrint(params){
  var invoiceId = params[0];
  var g = requireMerchant();
  if (g.redirect){ go(g.redirect); return; }
  var data = loadInvoiceForPrint(invoiceId);
  if (!data || data.invoice.merchant_id !== g.merchant.id){
    renderShell('<div class="card"><h2>Invoice not found</h2><p><a href="#/">← Back to Billing</a></p></div>');
    return;
  }
  var inner = buildReceiptInnerHTML(data.invoice, data.items, data.business, data.customer, data.displayDate);
  renderShell(
    '<div class="card"><a href="#/">← Back to Billing</a> &nbsp; <a href="#/sales">Sales</a></div>'+
    '<div class="receipt" id="printArea">'+inner+'</div>'+
    '<div class="center" style="margin-top:14px"><button type="button" onclick="window.print()">Print</button></div>'
  );
}

/* ================= Dashboard, Products, Customers, Sales, Bill Search, Reports ================= */

function renderDashboard(){
  var g = requireMerchant(); if (g.redirect){ go(g.redirect); return; }
  var m = g.merchant, db = loadDB();
  var paidBills = 0, paidSales = 0;
  db.invoices.forEach(function(inv){ if (inv.merchant_id===m.id && inv.status==='PAID'){ paidBills++; paidSales += inv.total; } });
  renderShell(
    brandHeader()+
    '<div class="card"><h1>'+escapeHtml(m.business_name)+'</h1><p class="muted">PAN: '+escapeHtml(m.pan)+' · '+escapeHtml(m.location)+' · '+escapeHtml(m.country)+'</p>'+
    '<div class="stats"><div class="stat"><b>Paid bills</b><br>'+paidBills+'</div><div class="stat"><b>Paid sales</b><br>NPR '+fmt2(paidSales)+'</div></div>'+
    navBar('#/merchant')+
    '<div class="card" style="margin-top:14px"><h2>Management</h2><div class="nav">'+
      '<a href="#/reports">Reports</a><a href="#/backup">Backup</a><a href="#/cloud-sync">Cloud Sync</a>'+
      '<a href="#/customers">Customers</a><a href="#/bill-search">Find/Open Bill</a></div></div>'+
    '</div>'
  );
}

function renderProducts(params, opts){
  opts = opts || {};
  var g = requireMerchant(); if (g.redirect){ go(g.redirect); return; }
  var m = g.merchant, db = loadDB();
  var rows = db.products.filter(function(p){return p.merchant_id===m.id;}).sort(function(a,b){return a.name<b.name?-1:1;});
  renderShell(
    '<div class="card"><h1>Product / Barcode Catalog</h1><p class="small">Barcodes and product QR codes remain stored until the merchant deletes the product.</p>'+navBar('#/products')+'</div>'+
    '<div class="card">'+(opts.error?'<p class="err">'+escapeHtml(opts.error)+'</p>':'')+
    '<form id="prodForm"><div class="row"><input name="barcode" placeholder="Barcode" required autofocus>'+
    '<button type="button" id="scanProdBtn" class="secondary" style="flex:0 0 auto" title="Scan with camera">📷 Scan</button>'+
    '<input name="name" placeholder="Item name" required><input name="price" type="number" step="0.01" min="0" placeholder="Selling price" required>'+
    '<button type="submit" style="flex:0 0 auto">Add product</button></div></form></div>'+
    '<div class="card"><h2>Products</h2><div class="tblwrap"><table><tr><th>Barcode</th><th>QR</th><th>Item</th><th>Selling Price</th><th></th></tr>'+
    (rows.length? rows.map(function(p){
      return '<tr><td>'+escapeHtml(p.barcode)+'</td><td><img class="qr-thumb" src="'+qrDataURL(p.barcode,{moduleSize:4,margin:2})+'"></td>'+
        '<td>'+escapeHtml(p.name)+'</td><td>NPR '+fmt2(p.price)+'</td><td><button type="button" class="danger del-prod" data-id="'+p.id+'">Delete</button></td></tr>';
    }).join('') : '<tr><td colspan="5">No products yet.</td></tr>')+
    '</table></div></div>'
  );
  qs('#scanProdBtn').addEventListener('click', function(){
    openBarcodeScanner(function(value){
      qs('[name=barcode]', qs('#prodForm')).value = value;
      qs('[name=name]', qs('#prodForm')).focus();
    });
  });
  qs('#prodForm').addEventListener('submit', function(e){
    e.preventDefault();
    var f = e.target;
    var barcode = qs('[name=barcode]',f).value.trim(), name = qs('[name=name]',f).value.trim();
    var price = parseFloat(qs('[name=price]',f).value);
    if (!barcode || !name || !(price>=0) || isNaN(price)){ renderProducts(params,{error:'Enter barcode, item name, and a valid price.'}); return; }
    var db2 = loadDB();
    var dup = db2.products.find(function(p){return p.merchant_id===m.id && p.barcode===barcode;});
    if (dup){ renderProducts(params,{error:'That barcode already exists for this merchant.'}); return; }
    db2.products.push({ id: nextSeq(db2,'products'), merchant_id:m.id, barcode:barcode, name:name, price:price, cost_price:0, stock_qty:0, reorder_level:0 });
    saveDB(db2);
    renderProducts(params);
  });
  qsa('.del-prod').forEach(function(btn){
    btn.addEventListener('click', function(){
      var db2 = loadDB();
      db2.products = db2.products.filter(function(p){ return !(p.id==btn.getAttribute('data-id') && p.merchant_id===m.id); });
      saveDB(db2);
      renderProducts(params);
    });
  });

    '<label>Transaction ID Field Name</label><input name="verify_field" value="'+escapeHtml(m.fonepay_verify_field||'transaction_id')+'">'+
    '<button type="submit">Save Fonepay Settings</button></form>'+

  );
  qs('#fpForm').addEventListener('submit', function(e){

    var fmid = qs('[name=merchant_id]',f).value.trim(), furl = qs('[name=api_url]',f).value.trim(),

function exportDBBlob(){
  var db = loadDB();
  return { blob: new Blob([JSON.stringify(db, null, 2)], {type:'application/json'}), db: db };
}

function renderCloudSync(params, opts){
  opts = opts || {};
  var g = requireMerchant(); if (g.redirect){ go(g.redirect); return; }
  var m = g.merchant, db = loadDB();
  var url = getSetting(db, 'CLOUD_URL_'+m.id, '');
  var token = getSetting(db, 'CLOUD_TOKEN_'+m.id, '');
  renderShell(
    '<div class="card"><h1>Cloud Sync</h1>'+
    '<p>Connect Billo to your own HTTPS sync service. Billo keeps local data (this browser\'s storage) as the primary copy; the remote service must implement your synchronization API.</p>'+
    (opts.error ? '<p class="err">'+escapeHtml(opts.error)+'</p>' : '')+
    (opts.success ? '<p class="ok">'+escapeHtml(opts.success)+'</p>' : '')+
    '<form id="cloudForm"><label>Sync API URL</label><input name="url" value="'+escapeHtml(url)+'" placeholder="https://your-server.example/api/billo/sync">'+
    '<label>API token</label><input name="token" type="password" value="'+escapeHtml(token)+'">'+
    '<button type="submit">Save Cloud Settings</button></form>'+
    '<div class="row" style="margin-top:10px"><button type="button" id="pushBtn" class="secondary">Push Local Database to Cloud</button>'+
    '<button type="button" id="pullBtn" class="secondary">Pull/Restore Database from Cloud</button></div>'+
    '<p><b>Security:</b> use HTTPS and a private server. Do not put bank passwords or API secrets in an unsecured sync endpoint.</p>'+
    '<p><a href="#/merchant">Back to Dashboard</a></p></div>'
  );
  qs('#cloudForm').addEventListener('submit', function(e){
    e.preventDefault();
    var db2 = loadDB();
    setSetting(db2, 'CLOUD_URL_'+m.id, qs('[name=url]',e.target).value.trim());
    setSetting(db2, 'CLOUD_TOKEN_'+m.id, qs('[name=token]',e.target).value.trim());
    saveDB(db2);
    renderCloudSync(params, {success:'Cloud settings saved.'});
  });
  qs('#pushBtn').addEventListener('click', function(){
    var db2 = loadDB();
    var u = getSetting(db2,'CLOUD_URL_'+m.id,''), t = getSetting(db2,'CLOUD_TOKEN_'+m.id,'');
    if (!u){ renderCloudSync(params,{error:'Set the sync URL first.'}); return; }
    fetch(u, { method:'POST', headers: Object.assign({'Content-Type':'application/json'}, t?{'Authorization':'Bearer '+t}:{}),
      body: JSON.stringify({ merchant_id:m.id, database: db2 }) })
      .then(function(r){ if (!r.ok) throw new Error('bad status'); renderCloudSync(params,{success:'Cloud backup uploaded.'}); })
      .catch(function(){ renderCloudSync(params,{error:'Could not connect to sync server.'}); });
  });
  qs('#pullBtn').addEventListener('click', function(){
    var db2 = loadDB();
    var u = getSetting(db2,'CLOUD_URL_'+m.id,''), t = getSetting(db2,'CLOUD_TOKEN_'+m.id,'');
    if (!u){ renderCloudSync(params,{error:'Set the sync URL first.'}); return; }
    fetch(u + (u.indexOf('?')>=0?'&':'?') + 'merchant_id='+encodeURIComponent(m.id), { headers: t?{'Authorization':'Bearer '+t}:{} })
      .then(function(r){ if (!r.ok) throw new Error('bad'); return r.json(); })
      .then(function(remote){
        if (!remote || !remote.merchants || !remote.invoices){ throw new Error('invalid'); }
        saveDB(remote);
        renderCloudSync(params,{success:'Cloud database restored.'});
      })
      .catch(function(){ renderCloudSync(params,{error:'Cloud restore failed.'}); });
  });
}

function renderBackup(){
  var g = requireMerchant(); if (g.redirect){ go(g.redirect); return; }
  var stamp = todayISODate();
  renderShell(
    '<div class="card"><h1>Backup</h1><p>Download a full backup of this browser\'s Billo data (all merchants sharing this storage), or restore from a previously downloaded file.</p>'+
    '<button type="button" id="downloadBtn">Download Backup (Billo-backup-'+stamp+'.json)</button>'+
    '<div style="margin-top:16px"><label>Restore from backup file</label><input type="file" id="restoreFile" accept="application/json"></div>'+
    '<div id="backupMsg" style="margin-top:8px"></div>'+
    '<p><a href="#/merchant">← Back to Dashboard</a></p></div>'
  );
  qs('#downloadBtn').addEventListener('click', function(){
    var ex = exportDBBlob();
    var url = URL.createObjectURL(ex.blob);
    var a = document.createElement('a'); a.href = url; a.download = 'Billo-backup-'+stamp+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
  });
  qs('#restoreFile').addEventListener('change', function(e){
    var file = e.target.files[0]; if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.merchants) || !Array.isArray(data.invoices)) throw new Error('bad shape');
        saveDB(data);
        qs('#backupMsg').innerHTML = '<p class="ok">Backup restored.</p>';
      } catch(err){
        qs('#backupMsg').innerHTML = '<p class="err">That file does not look like a valid Billo backup.</p>';
      }
    };
    reader.readAsText(file);
  });
}

function copyToClipboardFallback(text){
  var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly','');
  ta.style.position = 'fixed'; ta.style.left = '-9999px'; document.body.appendChild(ta); ta.focus(); ta.select();
  var ok = false; try { ok = document.execCommand('copy'); } catch(e){ ok = false; } ta.remove();
  if (ok){ toast('Copied to clipboard'); return; }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast('Copied to clipboard'); }).catch(function(){ window.prompt('Copy this text:', text); });
  } else { window.prompt('Copy this text:', text); }
}

    if (exists){ renderAdminDashboard(params,{error:'That phone number or email is already registered'}); return; }
    var expires = durationToExpiry(duration);

    f.addEventListener('submit', function(e){
      e.preventDefault();
      var newPw = qs('[name=new_password]', f).value;
      if (newPw.length<6){ renderAdminDashboard(params,{error:'Password must be at least 6 characters'}); return; }
      var db2 = loadDB();
      var mm = findMerchantById(db2, parseInt(f.getAttribute('data-id'),10));
      if (!mm){ renderAdminDashboard(params,{error:'Merchant not found'}); return; }
      mm.password_hash = hashPassword(newPw);
      saveDB(db2);
      renderAdminDashboard(params, {success:'Password reset'});
    });
  });
  qsa('.del-merchant-form').forEach(function(f){
    f.addEventListener('submit', function(e){
      e.preventDefault();
      var confirmVal = qs('[name=confirm]', f).value;
      if (confirmVal !== 'DELETE'){ renderAdminDashboard(params,{error:'Type DELETE to confirm'}); return; }
      var id = parseInt(f.getAttribute('data-id'),10);
      var db2 = loadDB();
      var mm = findMerchantById(db2, id);
      if (!mm){ renderAdminDashboard(params,{error:'Merchant not found'}); return; }
      var invoiceIds = db2.invoices.filter(function(i){return i.merchant_id===id;}).map(function(i){return i.invoice_id;});
      db2.items = db2.items.filter(function(it){ return invoiceIds.indexOf(it.invoice_id)===-1; });
      db2.invoices = db2.invoices.filter(function(i){ return i.merchant_id!==id; });
      db2.customers = db2.customers.filter(function(c){ return c.merchant_id!==id; });
      db2.products = db2.products.filter(function(p){ return p.merchant_id!==id; });
      db2.licenses.forEach(function(l){ if (l.merchant_id===id){ l.merchant_id=null; l.used_at=null; l.used_by_phone=null; l.status='UNUSED'; } });
      db2.merchants = db2.merchants.filter(function(mm2){ return mm2.id!==id; });
      saveDB(db2);
      renderAdminDashboard(params, {success:'Merchant deleted'});
    });
  });
}

    '<label>Verification API URL</label><input name="verify_url" value="'+escapeHtml(cfg.verify_url)+'" placeholder="https://...">'+
    '<label>Verification Method</label><select name="verify_method"><option '+(cfg.verify_method==='GET'?'selected':'')+'>GET</option><option '+(cfg.verify_method==='POST'?'selected':'')+'>POST</option></select>'+

    '<button type="submit">Save Fonepay API Settings</button></form></div>'

      FONEPAY_SUB_API_HEADERS: qs('[name=api_headers]',f).value.trim(), FONEPAY_SUB_API_BODY: qs('[name=api_body]',f).value.trim(),
      FONEPAY_SUB_API_QR_FIELD: qs('[name=qr_field]',f).value.trim() || 'qr', FONEPAY_SUB_VERIFY_URL: qs('[name=verify_url]',f).value.trim(),
      FONEPAY_SUB_VERIFY_METHOD: qs('[name=verify_method]',f).value.trim().toUpperCase(), FONEPAY_SUB_VERIFY_FIELD: qs('[name=verify_field]',f).value.trim() || 'status',
      FONEPAY_SUB_MERCHANT_ID: qs('[name=merchant_id]',f).value.trim()

function renderAdminSubscriptionSales(){
  if (!ADMIN_PANEL_ENABLED){ adminDisabledPage(); return; }
  if (!requirePosAdmin()){ renderAdminLogin(); return; }
  var db = loadDB();
  var paid = db.subscriptionPayments.filter(function(p){return p.status==='PAID';});
  var txns = paid.length, total = paid.reduce(function(s,p){return s+p.amount;},0);
  var byMethod = {}, byPlan = {}, byDay = {};
  db.subscriptionHistory.filter(function(h){return h.status==='ACTIVE';}).forEach(function(h){
    byMethod[h.payment_method] = byMethod[h.payment_method] || {payment_method:h.payment_method,txns:0,total:0};
    byMethod[h.payment_method].txns++; byMethod[h.payment_method].total += h.amount;
    var key = h.plan_code+'|'+h.plan_name;
    byPlan[key] = byPlan[key] || {plan_name:h.plan_name,txns:0,total:0};
    byPlan[key].txns++; byPlan[key].total += h.amount;
  });
  paid.forEach(function(p){
    var day = p.created_at.slice(0,10);
    byDay[day] = byDay[day] || {day:day,txns:0,total:0};
    byDay[day].txns++; byDay[day].total += p.amount;
  });
  var dailyRows = Object.values(byDay).sort(function(a,b){return a.day<b.day?1:-1;}).slice(0,90);
  var sales = db.subscriptionHistory.slice().sort(function(a,b){return b.id-a.id;}).slice(0,500);
  renderShell(
    '<div class="card top"><h1>📊 Billo Subscription Sales</h1><a href="#/admin">← Admin Panel</a></div>'+
    '<div class="card"><div class="stats"><div class="stat">Paid Transactions<br><b style="font-size:24px">'+txns+'</b></div>'+
    '<div class="stat">Total Subscription Sales<br><b style="font-size:24px">Rs '+fmt2(total)+'</b></div>'+
    '<div class="stat">Average Sale<br><b style="font-size:24px">Rs '+fmt2(txns?total/txns:0)+'</b></div></div></div>'+
    '<div class="card"><h2>Sales by Payment Method</h2><div class="tblwrap"><table><tr><th>Method</th><th>Transactions</th><th>Total Sales</th></tr>'+
    (Object.values(byMethod).length? Object.values(byMethod).sort(function(a,b){return b.total-a.total;}).map(function(r){return '<tr><td>'+escapeHtml(r.payment_method)+'</td><td>'+r.txns+'</td><td>Rs '+fmt2(r.total)+'</td></tr>';}).join('') : '<tr><td colspan="3">No sales yet.</td></tr>')+
    '</table></div></div>'+
    '<div class="card"><h2>Sales by Plan</h2><div class="tblwrap"><table><tr><th>Plan</th><th>Transactions</th><th>Total Sales</th></tr>'+
    (Object.values(byPlan).length? Object.values(byPlan).sort(function(a,b){return b.total-a.total;}).map(function(r){return '<tr><td>'+escapeHtml(r.plan_name)+'</td><td>'+r.txns+'</td><td>Rs '+fmt2(r.total)+'</td></tr>';}).join('') : '<tr><td colspan="3">No sales yet.</td></tr>')+
    '</table></div></div>'+
    '<div class="card"><h2>Daily Sales</h2><div class="tblwrap"><table><tr><th>Date</th><th>Transactions</th><th>Total</th></tr>'+
    (dailyRows.length? dailyRows.map(function(r){return '<tr><td>'+r.day+'</td><td>'+r.txns+'</td><td>Rs '+fmt2(r.total)+'</td></tr>';}).join('') : '<tr><td colspan="3">No sales yet.</td></tr>')+
    '</table></div></div>'+
    '<div class="card"><h2>Subscription Sale Records</h2><div class="tblwrap"><table><tr><th>Date</th><th>Merchant</th><th>Plan</th><th>Amount</th><th>Payment</th><th>Reference</th><th>Status</th><th>Expiry</th></tr>'+
    (sales.length? sales.map(function(s){
      var mm = findMerchantById(db, s.merchant_id) || {};
      return '<tr><td>'+escapeHtml(s.created_at)+'</td><td>'+escapeHtml(mm.business_name||'')+'<br><small>'+escapeHtml(mm.email||'')+'</small></td><td>'+escapeHtml(s.plan_name)+'</td>'+
        '<td>Rs '+fmt2(s.amount)+'</td><td>'+escapeHtml(s.payment_method)+'</td><td>'+escapeHtml(s.reference_id||'')+'</td><td>'+escapeHtml(s.status)+'</td><td>'+escapeHtml(s.expires_at)+'</td></tr>';
    }).join('') : '<tr><td colspan="8">No subscription records yet.</td></tr>')+
    '</table></div></div>'
  );
}
