    '<p><a href="#/admin">← Back to Admin Panel</a></p>'
  );

  if (rec.status===PAYMENT_STATUS.PENDING){
    qs('#approveBtn').addEventListener('click', function(){
      if (!window.confirm('Are you sure you have verified this payment in your Fonepay account?')) return;
      var db2 = loadDB();
      var res = ManualVerificationProvider.approve(db2, rec.id, {
        transactionId: qs('#vTxnId').value.trim(), amount: qs('#vAmount').value.trim(),
        senderName: qs('#vSender').value.trim(), note: qs('#vNote').value.trim()
      });
      saveDB(db2);
      setFlash(res.ok ? {success:'Payment verified — subscription activated.'} : {error: res.message});
      go('#/admin');
    });
    qs('#showRejectBtn').addEventListener('click', function(){ qs('#rejectPanel').classList.remove('hidden'); });
    qs('#confirmRejectBtn').addEventListener('click', function(){
      if (!window.confirm('Reject this payment request?')) return;
      var db2 = loadDB();
      var res = ManualVerificationProvider.reject(db2, rec.id, qs('#rejectReason').value, qs('#rejectNote').value.trim());
      saveDB(db2);
      setFlash(res.ok ? {success:'Payment request rejected.'} : {error: res.message});
      go('#/admin');
    });
  }
}

function renderAdminAuditLog(){
  if (!ADMIN_PANEL_ENABLED){ adminDisabledPage(); return; }
  if (!requirePosAdmin()){ renderAdminLogin(); return; }
  var db = loadDB();
  var rows = (db.auditLog||[]).slice().sort(function(a,b){return b.id-a.id;}).slice(0,300);
  renderShell(
    '<div class="card"><a href="#/admin">← Admin Panel</a><h1>Audit Log</h1><p class="small">Most recent 300 events (payment submissions, reviews, approvals, rejections, expirations).</p></div>'+
    '<div class="card"><div class="tblwrap"><table><tr><th>Time</th><th>Actor</th><th>Action</th><th>Payment ID</th><th>Details</th></tr>'+
    (rows.length ? rows.map(function(r){
      return '<tr><td>'+escapeHtml(r.timestamp)+'</td><td>'+escapeHtml(r.actor)+'</td><td>'+escapeHtml(r.action)+'</td><td>'+(r.payment_id||'')+'</td>'+
        '<td><code style="font-size:11px">'+escapeHtml(JSON.stringify(r.metadata||{}))+'</code></td></tr>';
    }).join('') : '<tr><td colspan="5">No events yet.</td></tr>')+
    '</table></div></div>'
  );
}

/* ================= Dispatch table ================= */
/* In the Admin edition, this build is admin-only: every merchant/POS route
   (login, signup, billing, products, etc.) redirects to the admin panel instead.
   The Merchant edition is completely unaffected by this list. */
var ADMIN_EDITION_ALLOWED_ROUTES = ['admin','admin-logout','admin-esewa','admin-fonepay-subscription','admin-subscription-sales','admin-payment','admin-audit-log'];

function dispatch(name, params){
  if (EDITION === 'admin' && ADMIN_EDITION_ALLOWED_ROUTES.indexOf(name) === -1){
    go('#/admin');
    return;
  }
  switch(name){
    case 'home': renderBilling(); break;
    case 'login': renderLogin(params); break;
    case 'signup': renderSignup(params); break;
    case 'logout': doLogout(); break;
    case 'subscribe': renderSubscribe(params); break;
    case 'subscribe-pay': renderSubscribePay(params); break;
    case 'subscribe-result': renderSubscribeResult(); break;
    case 'activate': renderActivate(params); break;
    case 'subscription-history': renderSubscriptionHistory(); break;
    case 'merchant': renderDashboard(); break;
    case 'products': renderProducts(params); break;
    case 'customers': renderCustomers(); break;
    case 'bill-search': renderBillSearch(); break;
    case 'sales': renderSales(); break;
    case 'reports': renderReports(); break;
    case 'fonepay-settings': renderFonepaySettings(params); break;
    case 'cloud-sync': renderCloudSync(params); break;
    case 'backup': renderBackup(); break;
    case 'print': renderPrint(params); break;
    case 'admin': renderAdminDashboard(params); break;
    case 'admin-logout': adminLogout(); break;
    case 'admin-esewa': renderAdminEsewa(); break;
    case 'admin-fonepay-subscription': renderAdminFonepaySubscription(); break;
    case 'admin-subscription-sales': renderAdminSubscriptionSales(); break;
    case 'admin-payment': renderAdminPaymentReview(params); break;
    case 'admin-audit-log': renderAdminAuditLog(); break;
    default: renderBilling();
  }
}

router();

</script>
</body>
</html>
