      FONEPAY_SUB_API_HEADERS: qs('[name=api_headers]',f).value.trim(), FONEPAY_SUB_API_BODY: qs('[name=api_body]',f).value.trim(),
      FONEPAY_SUB_API_QR_FIELD: qs('[name=qr_field]',f).value.trim() || 'qr', FONEPAY_SUB_VERIFY_URL: qs('[name=verify_url]',f).value.trim(),
      FONEPAY_SUB_VERIFY_METHOD: qs('[name=verify_method]',f).value.trim().toUpperCase(), FONEPAY_SUB_VERIFY_FIELD: qs('[name=verify_field]',f).value.trim() || 'status',
      FONEPAY_SUB_MERCHANT_ID: qs('[name=merchant_id]',f).value.trim()
    };
    if (fields.FONEPAY_SUB_API_HEADERS){
      try { JSON.parse(fields.FONEPAY_SUB_API_HEADERS); } catch(err){ renderAdminFonepaySubscription({error:'Headers must be valid JSON.'}); return; }
    }
    var db2 = loadDB();
    Object.keys(fields).forEach(function(k){ setSetting(db2,k,fields[k]); });
    saveDB(db2);
    setFlash({success:'Fonepay subscription Dynamic QR API settings saved'});
    go('#/admin');
  });
}

function renderAdminSubscriptionSales(){
  if (!ADMIN_PANEL_ENABLED){ adminDisabledPage(); return; }
  if (!requirePosAdmin()){ renderAdminLogin(); return; }
  var db = loadDB();
  var paid = db.subscriptionPayments.filter(function(p){return p.status==='PAID';});
  var txns = paid.length, total = paid.reduce(function(s,p){return s+p.amount;},0);
  var byMethod = {}, byPlan = {}, byDay = {};
  db.subscriptionHistory.filter(function(h){return h.status==='ACTIVE';}).forEach(function(h){
    byMethod[h.payment_method] = byMethod[h.payment_method] || {payment_method:h.payment_method,txns:0,total:0};
    byMethod[h.payment_method].txns++; byMethod[h.payment_method].total += h.amount;
    var key = h.plan_code+'|'+h.plan_name;
    byPlan[key] = byPlan[key] || {plan_name:h.plan_name,txns:0,total:0};
    byPlan[key].txns++; byPlan[key].total += h.amount;
  });
  paid.forEach(function(p){
    var day = p.created_at.slice(0,10);
    byDay[day] = byDay[day] || {day:day,txns:0,total:0};
    byDay[day].txns++; byDay[day].total += p.amount;
  });
  var dailyRows = Object.values(byDay).sort(function(a,b){return a.day<b.day?1:-1;}).slice(0,90);
  var sales = db.subscriptionHistory.slice().sort(function(a,b){return b.id-a.id;}).slice(0,500);
  renderShell(
    '<div class="card top"><h1>📊 Billo Subscription Sales</h1><a href="#/admin">← Admin Panel</a></div>'+
    '<div class="card"><div class="stats"><div class="stat">Paid Transactions<br><b style="font-size:24px">'+txns+'</b></div>'+
    '<div class="stat">Total Subscription Sales<br><b style="font-size:24px">Rs '+fmt2(total)+'</b></div>'+
    '<div class="stat">Average Sale<br><b style="font-size:24px">Rs '+fmt2(txns?total/txns:0)+'</b></div></div></div>'+
    '<div class="card"><h2>Sales by Payment Method</h2><div class="tblwrap"><table><tr><th>Method</th><th>Transactions</th><th>Total Sales</th></tr>'+
    (Object.values(byMethod).length? Object.values(byMethod).sort(function(a,b){return b.total-a.total;}).map(function(r){return '<tr><td>'+escapeHtml(r.payment_method)+'</td><td>'+r.txns+'</td><td>Rs '+fmt2(r.total)+'</td></tr>';}).join('') : '<tr><td colspan="3">No sales yet.</td></tr>')+
    '</table></div></div>'+
    '<div class="card"><h2>Sales by Plan</h2><div class="tblwrap"><table><tr><th>Plan</th><th>Transactions</th><th>Total Sales</th></tr>'+
    (Object.values(byPlan).length? Object.values(byPlan).sort(function(a,b){return b.total-a.total;}).map(function(r){return '<tr><td>'+escapeHtml(r.plan_name)+'</td><td>'+r.txns+'</td><td>Rs '+fmt2(r.total)+'</td></tr>';}).join('') : '<tr><td colspan="3">No sales yet.</td></tr>')+
    '</table></div></div>'+
    '<div class="card"><h2>Daily Sales</h2><div class="tblwrap"><table><tr><th>Date</th><th>Transactions</th><th>Total</th></tr>'+
    (dailyRows.length? dailyRows.map(function(r){return '<tr><td>'+r.day+'</td><td>'+r.txns+'</td><td>Rs '+fmt2(r.total)+'</td></tr>';}).join('') : '<tr><td colspan="3">No sales yet.</td></tr>')+
    '</table></div></div>'+
    '<div class="card"><h2>Subscription Sale Records</h2><div class="tblwrap"><table><tr><th>Date</th><th>Merchant</th><th>Plan</th><th>Amount</th><th>Payment</th><th>Reference</th><th>Status</th><th>Expiry</th></tr>'+
    (sales.length? sales.map(function(s){
      var mm = findMerchantById(db, s.merchant_id) || {};
      return '<tr><td>'+escapeHtml(s.created_at)+'</td><td>'+escapeHtml(mm.business_name||'')+'<br><small>'+escapeHtml(mm.email||'')+'</small></td><td>'+escapeHtml(s.plan_name)+'</td>'+
        '<td>Rs '+fmt2(s.amount)+'</td><td>'+escapeHtml(s.payment_method)+'</td><td>'+escapeHtml(s.reference_id||'')+'</td><td>'+escapeHtml(s.status)+'</td><td>'+escapeHtml(s.expires_at)+'</td></tr>';
    }).join('') : '<tr><td colspan="8">No subscription records yet.</td></tr>')+
    '</table></div></div>'
  );
}

function renderAdminPaymentReview(params){
  if (!ADMIN_PANEL_ENABLED){ adminDisabledPage(); return; }
  if (!requirePosAdmin()){ renderAdminLogin(); return; }
  var id = parseInt(params[0], 10);
  var db = loadDB();
  var expiredAny = ManualVerificationProvider.expireStale(db);
  var rec = db.subscriptionPayments.find(function(p){ return p.id===id; });
  if (!rec){
    if (expiredAny) saveDB(db);
    renderShell('<div class="card"><h2>Payment request not found.</h2><p><a href="#/admin">← Admin Panel</a></p></div>');
    return;
  }
  var mm = findMerchantById(db, rec.merchant_id) || {};
  logAudit(db, 'admin', 'payment_viewed', rec.id, {});
  saveDB(db);

  var reasonOptions = REJECTION_REASONS.map(function(r){ return '<option>'+escapeHtml(r)+'</option>'; }).join('');

  renderShell(
    '<div class="card"><a href="#/admin">← Admin Panel</a><h1>Review Payment Request</h1></div>'+
    '<div class="card"><h3 style="margin-top:0">Merchant</h3><table>'+
    '<tr><td>Business Name</td><td>'+escapeHtml(mm.business_name||'')+'</td></tr>'+
    '<tr><td>Phone</td><td>'+escapeHtml(mm.phone||'')+'</td></tr>'+
    '<tr><td>Email</td><td>'+escapeHtml(mm.email||'')+'</td></tr>'+
    '</table></div>'+
    '<div class="card"><h3 style="margin-top:0">Payment Request</h3><table>'+
    '<tr><td>Package</td><td>'+escapeHtml(rec.plan_name)+'</td></tr>'+
    '<tr><td>Amount</td><td>Rs '+fmt2(rec.amount)+'</td></tr>'+
    '<tr><td>Payment Code</td><td style="font-weight:800">'+escapeHtml(rec.payment_code)+'</td></tr>'+
    '<tr><td>Sender Name (claimed)</td><td>'+escapeHtml(rec.sender_name)+'</td></tr>'+
    '<tr><td>Submitted</td><td>'+escapeHtml(rec.submitted_at)+'</td></tr>'+
    '<tr><td>Expires</td><td>'+escapeHtml(rec.expires_at)+'</td></tr>'+
    '<tr><td>Status</td><td>'+fonepayStatusBadge(rec.status)+'</td></tr>'+
    (rec.reviewed_at ? '<tr><td>Reviewed</td><td>'+escapeHtml(rec.reviewed_at)+' by '+escapeHtml(rec.reviewed_by||'')+'</td></tr>' : '')+
    (rec.status===PAYMENT_STATUS.REJECTED ? '<tr><td>Rejection Reason</td><td>'+escapeHtml(rec.admin_rejection_reason)+(rec.admin_note?' — '+escapeHtml(rec.admin_note):'')+'</td></tr>' : '')+
    (rec.verified_transaction_id ? '<tr><td>Verified Transaction ID</td><td>'+escapeHtml(rec.verified_transaction_id)+'</td></tr>' : '')+
    (rec.verified_amount!=null ? '<tr><td>Verified Amount</td><td>Rs '+fmt2(rec.verified_amount)+'</td></tr>' : '')+
    (rec.verified_sender_name ? '<tr><td>Verified Sender Name</td><td>'+escapeHtml(rec.verified_sender_name)+'</td></tr>' : '')+
    '</table></div>'+
    '<div class="card center"><h3 style="margin-top:0">Voucher</h3>'+
    '<a href="'+rec.voucher_data_url+'" target="_blank"><img src="'+rec.voucher_data_url+'" style="max-width:100%;max-height:420px;border:1px solid var(--billo-border);border-radius:8px"></a>'+
    '<p class="small">'+escapeHtml(rec.voucher_original_filename||'')+' ('+humanFileSize(rec.voucher_size||0)+') — tap to open full size</p></div>'+
    (rec.status===PAYMENT_STATUS.PENDING ? (
      '<div class="card"><h3 style="margin-top:0">Verify &amp; Decide</h3>'+
      '<label>Verified Transaction ID (optional)</label><input id="vTxnId" placeholder="From your Fonepay statement">'+
      '<label>Verified Amount (optional)</label><input id="vAmount" type="number" step="0.01" placeholder="'+fmt2(rec.amount)+'">'+
      '<label>Verified Sender Name (optional)</label><input id="vSender" placeholder="'+escapeHtml(rec.sender_name)+'">'+
      '<label>Admin Note (optional)</label><textarea id="vNote" style="min-height:60px"></textarea>'+
      '<div class="row" style="margin-top:10px"><button type="button" id="approveBtn">✓ Approve</button>'+
      '<button type="button" class="danger" id="showRejectBtn">Reject</button></div>'+
      '<div id="rejectPanel" class="hidden" style="margin-top:14px;border-top:1px solid var(--billo-border);padding-top:14px">'+
        '<label>Reason</label><select id="rejectReason">'+reasonOptions+'</select>'+
        '<label>Additional note (optional)</label><textarea id="rejectNote" style="min-height:50px"></textarea>'+
        '<button type="button" class="danger" id="confirmRejectBtn" style="margin-top:8px">Confirm Rejection</button>'+
      '</div></div>'
    ) : '')+
    '<p><a href="#/admin">← Back to Admin Panel</a></p>'
  );

  if (rec.status===PAYMENT_STATUS.PENDING){
    qs('#approveBtn').addEventListener('click', function(){
      if (!window.confirm('Are you sure you have verified this payment in your Fonepay account?')) return;
      var db2 = loadDB();
      var res = ManualVerificationProvider.approve(db2, rec.id, {
        transactionId: qs('#vTxnId').value.trim(), amount: qs('#vAmount').value.trim(),
        senderName: qs('#vSender').value.trim(), note: qs('#vNote').value.trim()
      });
      saveDB(db2);
      setFlash(res.ok ? {success:'Payment verified — subscription activated.'} : {error: res.message});
      go('#/admin');
    });
    qs('#showRejectBtn').addEventListener('click', function(){ qs('#rejectPanel').classList.remove('hidden'); });
    qs('#confirmRejectBtn').addEventListener('click', function(){
      if (!window.confirm('Reject this payment request?')) return;
      var db2 = loadDB();
      var res = ManualVerificationProvider.reject(db2, rec.id, qs('#rejectReason').value, qs('#rejectNote').value.trim());
      saveDB(db2);
      setFlash(res.ok ? {success:'Payment request rejected.'} : {error: res.message});
      go('#/admin');
    });
  }
}

function renderAdminAuditLog(){
  if (!ADMIN_PANEL_ENABLED){ adminDisabledPage(); return; }
  if (!requirePosAdmin()){ renderAdminLogin(); return; }
  var db = loadDB();
  var rows = (db.auditLog||[]).slice().sort(function(a,b){return b.id-a.id;}).slice(0,300);
  renderShell(
    '<div class="card"><a href="#/admin">← Admin Panel</a><h1>Audit Log</h1><p class="small">Most recent 300 events (payment submissions, reviews, approvals, rejections, expirations).</p></div>'+
    '<div class="card"><div class="tblwrap"><table><tr><th>Time</th><th>Actor</th><th>Action</th><th>Payment ID</th><th>Details</th></tr>'+
    (rows.length ? rows.map(function(r){
      return '<tr><td>'+escapeHtml(r.timestamp)+'</td><td>'+escapeHtml(r.actor)+'</td><td>'+escapeHtml(r.action)+'</td><td>'+(r.payment_id||'')+'</td>'+
        '<td><code style="font-size:11px">'+escapeHtml(JSON.stringify(r.metadata||{}))+'</code></td></tr>';
    }).join('') : '<tr><td colspan="5">No events yet.</td></tr>')+
    '</table></div></div>'
  );
}

/* ================= Dispatch table ================= */
/* In the Admin edition, this build is admin-only: every merchant/POS route
   (login, signup, billing, products, etc.) redirects to the admin panel instead.
   The Merchant edition is completely unaffected by this list. */
var ADMIN_EDITION_ALLOWED_ROUTES = ['admin','admin-logout','admin-esewa','admin-fonepay-subscription','admin-subscription-sales','admin-payment','admin-audit-log'];

function dispatch(name, params){
  if (EDITION === 'admin' && ADMIN_EDITION_ALLOWED_ROUTES.indexOf(name) === -1){
    go('#/admin');
    return;
  }
  switch(name){
    case 'home': renderBilling(); break;
    case 'login': renderLogin(params); break;
    case 'signup': renderSignup(params); break;
    case 'logout': doLogout(); break;
    case 'subscribe': renderSubscribe(params); break;
    case 'subscribe-pay': renderSubscribePay(params); break;
    case 'subscribe-result': renderSubscribeResult(); break;
    case 'activate': renderActivate(params); break;
    case 'subscription-history': renderSubscriptionHistory(); break;
    case 'merchant': renderDashboard(); break;
    case 'products': renderProducts(params); break;
    case 'customers': renderCustomers(); break;
    case 'bill-search': renderBillSearch(); break;
    case 'sales': renderSales(); break;
    case 'reports': renderReports(); break;
    case 'fonepay-settings': renderFonepaySettings(params); break;
    case 'cloud-sync': renderCloudSync(params); break;
    case 'backup': renderBackup(); break;
    case 'print': renderPrint(params); break;
    case 'admin': renderAdminDashboard(params); break;
    case 'admin-logout': adminLogout(); break;
    case 'admin-esewa': renderAdminEsewa(); break;
    case 'admin-fonepay-subscription': renderAdminFonepaySubscription(); break;
    case 'admin-subscription-sales': renderAdminSubscriptionSales(); break;
    case 'admin-payment': renderAdminPaymentReview(params); break;
    case 'admin-audit-log': renderAdminAuditLog(); break;
    default: renderBilling();
  }
}

router();

</script>
